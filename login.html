<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Iniciar Sesión - House Solutions</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 20px 0;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            height: 80px;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        form input {
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        form button {
            margin-top: 25px;
            padding: 12px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        form button:hover {
            background-color: #0056b3;
        }

        .texto-ayuda {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }

        .recuperar {
            margin-top: 10px;
            text-align: right;
        }

        .recuperar a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .recuperar a:hover {
            text-decoration: underline;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
    </style>
</head>

<body>
    <header>
        <img src="assets/logo.png" class="logo" alt="Logo House Solutions" />
        <h1>Iniciar Sesión</h1>
    </header>

    <main>
        <form onsubmit="login(event)" novalidate>
            <p class="texto-ayuda">Ingrese su <strong>correo electrónico</strong> y su contraseña registrada</p>

            <input type="email" id="loginUser" placeholder="Correo electrónico" required autocomplete="email" />
            <input type="password" id="loginPass" placeholder="Contraseña" required autocomplete="current-password" />
            <button type="submit">Entrar</button>

            <div class="recuperar">
                <a href="recuperar.html">¿Olvidó su usuario o contraseña?</a>
            </div>

            <p id="mensaje" role="alert" aria-live="polite"></p>
        </form>
    </main>

    <script>
        async function login(e) {
            e.preventDefault();

            const correo = document.getElementById("loginUser").value.trim();
            const contrasena = document.getElementById("loginPass").value.trim();
            const mensaje = document.getElementById("mensaje");
            mensaje.textContent = "";

            try {
                const response = await fetch("http://localhost:3000/api/usuarios/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ correo, contrasena })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.mensaje || "Error en la autenticación");
                }

                mensaje.style.color = "green";
                mensaje.textContent = data.mensaje || "Inicio de sesión exitoso";

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);
            } catch (error) {
                mensaje.style.color = "red";
                mensaje.textContent = `❌ ${error.message || "Error al conectar con el servidor."}`;
            }
        }
    </script>
</body>

</html>
