<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House Solutions - Catálogo</title>
    <link rel="stylesheet" href="style.css" />
    <script src="auth.js"></script>
</head>

<body>
    <!-- Proteger esta página: solo accesible si estás logueado -->
    <script>
        requireLogin();
    </script>
    <header>
        <img src="assets/logo.png" alt="Logo House Solutions" class="logo" />
        <div class="acciones-header">
            <span onclick="toggleBusqueda()">🔍 Buscar</span>
            <span onclick="mostrarCarrito()">🛒 Carrito</span>
            <span onclick="cerrarSesion()">🚪 Cerrar sesión</span>
        </div>
    </header>

    <div id="buscador" style="display: none; padding: 20px; background: #f5f5f5; width: 100%;">
        <input type="text" id="inputBusqueda" placeholder="Buscar producto..." onkeyup="filtrarProductos()"
            style="width: 100%; padding: 10px; font-size: 16px;">
    </div>

    <main>
        <div class="grid-productos" id="listaProductos">
            <!-- Ejemplo productos -->
            <div class="producto" data-nombre="Arroz">
                <img src="assets/arroz.png" alt="Arroz" />
                <h3>Arroz</h3>
                <p>$4.500/kg</p>
                <input type="number" id="cantidad-Arroz" min="1" placeholder="Kg" />
                <button onclick="agregarAlCarrito('Arroz', 4500)">🛒 Añadir</button>
            </div>

            <!-- Más productos aquí... -->
            <div class="producto" data-nombre="Frijol">
                <img src="assets/frijol.png" alt="Frijol" />
                <h3>Frijol</h3>
                <p>$8.600/kg</p>
                <input type="number" id="cantidad-Frijol" min="1" placeholder="Kg" />
                <button onclick="agregarAlCarrito('Frijol', 8600)">🛒 Añadir</button>
            </div>
        </div>
    </main>

    <!-- MODAL DEL CARRITO -->
    <div id="modalCarrito"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 500px;">
            <h2>🛒 Tu Carrito</h2>
            <ul id="listaCarrito" style="list-style: none; padding: 0;"></ul>
            <h3 id="totalCarrito" style="text-align: right; margin-top: 20px;">Total: $0</h3>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="cerrarCarrito()" style="flex: 1; padding: 10px; background: #ccc;">Cerrar</button>
                <button onclick="finalizarCompra()"
                    style="flex: 1; padding: 10px; background: #28a745; color: white;">Comprar</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2023 House Solutions</p>
    </footer>

    <!-- Notificación temporal para agregar al carrito -->
    <div id="notificacionCarrito"
        style="display: none; position: fixed; top: 20px; right: 20px; background: #28a745; color: white; padding: 15px 20px; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; font-weight: bold;">
        ✅ Producto agregado al carrito
    </div>

    <script>
        // Mostrar/Ocultar buscador
        function toggleBusqueda() {
            const buscador = document.getElementById('buscador');
            buscador.style.display = buscador.style.display === 'none' || buscador.style.display === '' ? 'block' : 'none';
        }

        // Filtrar productos por nombre
        function filtrarProductos() {
            const filtro = document.getElementById('inputBusqueda').value.toLowerCase();
            const productos = document.querySelectorAll('.producto');
            productos.forEach((producto) => {
                const nombre = producto.getAttribute('data-nombre').toLowerCase();
                producto.style.display = nombre.includes(filtro) ? 'block' : 'none';
            });
        }

        // Añadir producto al carrito (localStorage)
        function agregarAlCarrito(nombre, precio) {
            const input = document.getElementById(`cantidad-${nombre}`);
            const cantidad = parseInt(input.value);

            if (!cantidad || cantidad <= 0) {
                mostrarNotificacion('⚠️ Ingresa una cantidad válida.', 'warning');
                return;
            }

            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            const item = carrito.find((p) => p.nombre === nombre);

            if (item) {
                item.cantidad += cantidad;
            } else {
                carrito.push({ nombre, precio, cantidad });
            }

            localStorage.setItem('carrito', JSON.stringify(carrito));
            mostrarNotificacion(`✅ ${cantidad} kg de ${nombre} añadidos al carrito.`);
            input.value = '';
        }

        // Mostrar notificación temporal
        function mostrarNotificacion(mensaje, tipo = 'success') {
            const notificacion = document.getElementById('notificacionCarrito');
            notificacion.textContent = mensaje;
            notificacion.style.background = tipo === 'warning' ? '#ffc107' : '#28a745';
            notificacion.style.color = tipo === 'warning' ? '#000' : '#fff';
            notificacion.style.display = 'block';

            // Ocultar automáticamente después de 3 segundos
            setTimeout(() => {
                notificacion.style.display = 'none';
            }, 3000);
        }

        // Mostrar modal del carrito
        function mostrarCarrito() {
            const modal = document.getElementById('modalCarrito');
            const lista = document.getElementById('listaCarrito');
            const total = document.getElementById('totalCarrito');
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];

            lista.innerHTML = '';
            let totalCompra = 0;

            carrito.forEach((p, i) => {
                const li = document.createElement('li');
                const subtotal = p.precio * p.cantidad;
                totalCompra += subtotal;

                li.innerHTML = `
                    ${p.nombre} x${p.cantidad} kg - $${subtotal.toLocaleString()}
                    <button onclick="eliminarDelCarrito(${i})" style="margin-left:10px; color:red;">❌</button>
                `;
                lista.appendChild(li);
            });

            total.textContent = `Total: $${totalCompra.toLocaleString()}`;
            modal.style.display = 'block';
        }

        // Eliminar item del carrito
        function eliminarDelCarrito(index) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            carrito.splice(index, 1);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            mostrarCarrito();
        }

        // Cerrar modal carrito
        function cerrarCarrito() {
            document.getElementById('modalCarrito').style.display = 'none';
        }

        // Finalizar compra
        function finalizarCompra() {
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            if (carrito.length === 0) {
                mostrarNotificacion('⚠️ Tu carrito está vacío.', 'warning');
                return;
            }

            const confirmar = confirm('¿Estás seguro de que deseas ir a la pasarela de pagos?');
            if (!confirmar) {
                return;
            }

            document.getElementById('modalCarrito').style.display = 'none';
            mostrarNotificacion('✅ Redirigiendo a la pasarela de pagos...');
            setTimeout(() => {
                window.location.href = 'payment.html';
            }, 1000);
        }

        // Cerrar sesión (limpia sesión y redirige a login)
        function cerrarSesion() {
            if (confirm('¿Deseas cerrar sesión?')) {
                logout(); // Usar función de auth.js
            }
        }
    </script>

    <script src="script.js"></script>
</body>

</html>
