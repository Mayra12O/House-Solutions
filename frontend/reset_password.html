<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cambiar contraseña - House Solutions</title>
    <link rel="stylesheet" href="style.css" />
    <script src="auth.js"></script>
    <style>
        /* ...estilos sencillos para el formulario... */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 14px
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer
        }

        .btn-primary {
            background: #007bff;
            color: #fff
        }

        .btn-secondary {
            background: #6c757d;
            color: #fff
        }

        .info {
            font-size: 13px;
            color: #666;
            margin-top: 8px
        }

        .error {
            color: #d9534f;
            font-size: 13px;
            margin-top: 8px
        }
    </style>
</head>

<body>
    <!-- Si ya está autenticado, redirige a index.html -->
    <script>
        redirectIfAuthenticated();
    </script>
    <div class="container">
        <h1>Cambiar contraseña</h1>
        <p class="info" id="infoText">Introduce tu nueva contraseña.</p>

        <form id="resetForm">
            <!-- Campo para que el usuario ingrese su correo asociado (prefill desde localStorage/URL) -->
            <label for="recoveryEmail">Correo asociado</label>
            <input type="text" id="recoveryEmail" placeholder="Tu correo registrado" required />

            <!-- Campo para que el usuario ingrese el código de recuperación -->
            <label for="recoveryCode">Código de recuperación</label>
            <input type="text" id="recoveryCode" placeholder="Introduce el código que recibiste por correo" required />

            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" minlength="8" required />

            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" minlength="8" required />

            <div class="error" id="errorMsg" style="display:none;"></div>

            <div class="actions">
                <a href="login.html" class="btn-secondary"
                    style="text-decoration:none;padding:10px 14px;display:inline-block;color:#fff;border-radius:4px">Volver</a>
                <button type="submit" class="btn-primary" id="submitBtn">Guardar</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="src/services/alertService.js"></script>
    <script>
        // Obtener código y email de la URL o localStorage; manejar el campo de código y correo
        const params = new URLSearchParams(window.location.search);
        const codeFromUrl = params.get('code') || '';
        const emailFromUrl = params.get('email') || '';
        const tokenFromUrl = params.get('token') || '';
        const savedToken = (() => { try { return localStorage.getItem('recoveryToken'); } catch (e) { return null; } })();
        const tokenPrefill = tokenFromUrl || savedToken || '';
        const savedEmail = (() => { try { return localStorage.getItem('recoveryEmail'); } catch (e) { return null; } })();
        const correoPrefill = (emailFromUrl || savedEmail || '').toLowerCase();

        const recoveryCodeInput = document.getElementById('recoveryCode');
        const recoveryEmailInput = document.getElementById('recoveryEmail');
        const infoText = document.getElementById('infoText');
        const errorMsg = document.getElementById('errorMsg');
        const form = document.getElementById('resetForm');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');

        // Prefill si la URL contiene ?code=...; ajustar mensaje informativo
        if (codeFromUrl) {
            recoveryCodeInput.value = codeFromUrl;
            infoText.textContent = 'Código prellenado desde el enlace. Introduce tu nueva contraseña.';
        } else {
            infoText.textContent = 'Introduce el código de recuperación que recibiste por correo y tu nueva contraseña.';
        }
        // Prefill del correo desde localStorage o URL
        if (correoPrefill) recoveryEmailInput.value = correoPrefill;
        // Indicar si existe token guardado
        if (tokenPrefill) {
            infoText.textContent += ' (token disponible en localStorage)';
        }

        function mostrarError(msg) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = msg;
        }

        function limpiarError() {
            errorMsg.style.display = 'none';
            errorMsg.textContent = '';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            limpiarError();

            const codeValue = recoveryCodeInput.value.trim();
            const correo = (recoveryEmailInput.value || '').trim().toLowerCase();
            // validación básica de correo
            const re = /\S+@\S+\.\S+/;
            if (!correo || !re.test(correo)) {
                mostrarError('Ingresa un correo válido asociado a tu cuenta.');
                return;
            }
            if (!codeValue) {
                mostrarError('Ingresa el código de recuperación enviado por correo.');
                return;
            }

            const password = passwordInput.value.trim();
            const confirm = confirmInput.value.trim();

            if (password.length < 8) {
                mostrarError('La contraseña debe tener al menos 8 caracteres.');
                return;
            }
            if (password !== confirm) {
                mostrarError('Las contraseñas no coinciden.');
                return;
            }

            // Deshabilitar botón mientras se procesa
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                // Obtener token desde localStorage/URL (preferido) y enviarlo al backend
                const tokenToSend = tokenPrefill;
                if (!tokenToSend) {
                    mostrarError('No se encontró el token de recuperación. Vuelve a solicitar el código.');
                    btn.disabled = false;
                    btn.textContent = 'Guardar';
                    return;
                }

                // Enviar correo, código, token y nueva contraseña (JSON)
                const body = { correo, code: codeValue, password, token: tokenToSend };

                const res = await fetch(getApiUrl('/api/usuarios/reset-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    const message = err.message || 'Ocurrió un error al cambiar la contraseña.';
                    AlertService.toast(message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Guardar';
                    return;
                }

                // Éxito
                AlertService.toast('✅ Contraseña actualizada correctamente.');
                // limpiar email/token guardados
                try { localStorage.removeItem('recoveryEmail'); localStorage.removeItem('recoveryToken'); } catch (e) { }
                setTimeout(() => { window.location.href = 'login.html'; }, 1200);
            } catch (error) {
                AlertService.toast('Error de conexión. Intenta nuevamente.', 'error');
                btn.disabled = false;
                btn.textContent = 'Guardar';
            }
        });

        // Validación en vivo: limpiar errores al escribir
        [recoveryEmailInput, recoveryCodeInput, passwordInput, confirmInput].forEach(input => {
            input.addEventListener('input', () => { limpiarError(); });
        });
    </script>
</body>

</html>
